
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Quiz Application</title>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0001;
      margin-bottom: 20px;
    }

    h1, h2 { color: #183b66; }

    input[type="file"] {
      margin: 15px 0;
      padding: 10px;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 12px 20px;
      background: #1769aa;
      color: white;
      cursor: pointer;
      font-size: 15px;
      margin: 5px;
    }

    button:hover { background: #0d4f85; }

    .hidden { display: none; }

    .question {
      border-bottom: 1px solid #ddd;
      padding-bottom: 22px;
      margin-bottom: 25px;
    }

    .question h3 {
      margin-bottom: 15px;
    }

    label {
      display: block;
      padding: 10px;
      margin: 6px 0;
      background: #f1f5f9;
      border-radius: 6px;
      cursor: pointer;
    }

    label:hover { background: #dceeff; }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    .success {
      color: #087f23;
      font-weight: bold;
    }

    .result-item {
      padding: 15px;
      margin: 12px 0;
      border-radius: 8px;
      background: #f5f5f5;
    }

    .correct { border-left: 6px solid green; }
    .incorrect { border-left: 6px solid red; }

    .score {
      font-size: 24px;
      font-weight: bold;
      color: #1769aa;
    }

#quizSection input {
  user-select: auto;
}
#studentSection input {
  padding: 12px;
  margin: 6px;
  width: 40%;
  border: 1px solid #ccc;
  border-radius: 5px;
}
  </style>
</head>

<body>
  <div class="container">
    <div class="card" id="uploadSection">
      <h1>📘 Quiz Administrator</h1>
      <p>Upload an Excel file containing questions from exactly five units.</p>

      <input type="file" id="excelFile" accept=".xlsx,.xls" />
      <br />
      <button onclick="loadExcel()">Load Questions</button>

      <p id="uploadMessage"></p>

      <hr />

      <h3>Required Excel Columns</h3>
      <code>
        Unit, Question, Option A, Option B, Option C, Option D,
        Correct Answer, Explanation
      </code>
    </div>
<div class="card" id="studentSection">
  <h2>Student Information</h2>

  <input id="studentName" placeholder="Student name" required />
  <input id="registerNumber" placeholder="Register number" required />

  <br />
  <button onclick="startQuiz()">Start Quiz</button>
  <p id="studentMessage" class="error"></p>
</div>

    <div class="card hidden" id="quizSection">
      <h1>📝 Quiz</h1>
      <p id="progress"></p>
      <form id="quizForm"></form>
      <button onclick="submitQuiz()">Submit Quiz</button>
    </div>

    <div class="card hidden" id="resultSection">
      <h1>📊 Quiz Results</h1>
      <p id="score" class="score"></p>
      <div id="results"></div>
      <button onclick="location.reload()">Start New Quiz</button>
    </div>
  </div>

  <script>
    let quizQuestions = [];

    const requiredColumns = [
      "Unit",
      "Question",
      "Option A",
      "Option B",
      "Option C",
      "Option D",
      "Correct Answer",
       ];

    function normalize(value) {
      return String(value ?? "").trim();
    }

   function shuffle(array) {
  const copiedArray = [...array];

  for (let i = copiedArray.length - 1; i > 0; i--) {
    const randomIndex = Math.floor(Math.random() * (i + 1));

    [copiedArray[i], copiedArray[randomIndex]] =
      [copiedArray[randomIndex], copiedArray[i]];
  }

  return copiedArray;
}

    function getColumn(row, name) {
      const key = Object.keys(row).find(
        k => k.trim().toLowerCase() === name.toLowerCase()
      );
      return key ? normalize(row[key]) : "";
    }

    function loadExcel() {
      const file = document.getElementById("excelFile").files[0];
      const message = document.getElementById("uploadMessage");

      if (!file) {
        message.className = "error";
        message.textContent = "Please select an Excel file.";
        return;
      }

      const reader = new FileReader();

      reader.onload = function(event) {
        try {
          const workbook = XLSX.read(event.target.result, { type: "array" });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet);

          if (!rows.length) {
            throw new Error("The Excel file is empty.");
          }

          const missingColumns = requiredColumns.filter(column =>
            !Object.keys(rows[0]).some(
              key => key.trim().toLowerCase() === column.toLowerCase()
            )
          );

          if (missingColumns.length) {
            throw new Error(
              "Missing columns: " + missingColumns.join(", ")
            );
          }

          const questions = rows.map(row => ({
            unit: getColumn(row, "Unit"),
            question: getColumn(row, "Question"),
            options: {
              A: getColumn(row, "Option A"),
              B: getColumn(row, "Option B"),
              C: getColumn(row, "Option C"),
              D: getColumn(row, "Option D")
            },
            correct: getColumn(row, "Correct Answer").toUpperCase()
           
          }));

          const units = [...new Set(questions.map(q => q.unit))];

          if (units.length !== 5) {
            throw new Error(
              `The file must contain exactly 5 units. Found ${units.length}.`
            );
          }

          for (const unit of units) {
            const unitQuestions = questions.filter(q => q.unit === unit);

            if (unitQuestions.length < 4) {
              throw new Error(
                `${unit} must contain at least 4 questions.`
              );
            }
          }

          for (const question of questions) {
            if (!["A", "B", "C", "D"].includes(question.correct)) {
              throw new Error(
                `Invalid correct answer in question: ${question.question}`
              );
            }
          }

          quizQuestions = [];

          units.forEach(unit => {
            const unitQuestions = questions.filter(q => q.unit === unit);
            quizQuestions.push(...shuffle(unitQuestions).slice(0, 4));
          });

          quizQuestions = shuffle(quizQuestions);

          displayQuiz();

          message.className = "success";
          message.textContent = "Questions loaded successfully.";
        } catch (error) {
          message.className = "error";
          message.textContent = error.message;
        }
      };

      reader.readAsArrayBuffer(file);
    }

   function displayQuiz() {
  const form = document.getElementById("quizForm");
  form.innerHTML = "";

  quizQuestions.forEach((q, index) => {
    const questionDiv = document.createElement("div");
    questionDiv.className = "question";

    const shuffledOptions = shuffle(
      Object.keys(q.options).map(letter => ({
        key: letter,
        text: q.options[letter]
      }))
    );

    questionDiv.innerHTML = `
      <h3>${index + 1}. ${escapeHtml(q.question)}</h3>

      ${shuffledOptions.map(option => `
        <label>
          <input type="radio"
                 name="question${index}"
                 value="${option.key}">
          ${escapeHtml(option.text)}
        </label>
      `).join("")}
    `;

    form.appendChild(questionDiv);
  });

  document.getElementById("uploadSection").classList.add("hidden");
  document.getElementById("studentSection").classList.add("hidden");
  document.getElementById("quizSection").classList.remove("hidden");
}

    function submitQuiz() {
      let score = 0;
      let unanswered = [];

      quizQuestions.forEach((q, index) => {
        const selected = document.querySelector(
          `input[name="question${index}"]:checked`
        );

        if (!selected) {
          unanswered.push(index + 1);
        } else if (selected.value === q.correct) {
          score++;
        }
      });

      if (unanswered.length) {
        alert(
          "Please answer question(s): " + unanswered.join(", ")
        );
        return;
      }

      const results = document.getElementById("results");
      results.innerHTML = "";

      quizQuestions.forEach((q, index) => {
        const selected = document.querySelector(
          `input[name="question${index}"]:checked`
        ).value;

        const isCorrect = selected === q.correct;
        const resultDiv = document.createElement("div");

        resultDiv.className =
          "result-item " + (isCorrect ? "correct" : "incorrect");

        resultDiv.innerHTML = `
          <strong>${index + 1}. ${escapeHtml(q.question)}</strong>
          <p>Your answer:
            <strong>${selected}. ${escapeHtml(q.options[selected])}</strong>
          </p>
          <p>Correct answer:
            <strong>${q.correct}. ${escapeHtml(q.options[q.correct])}</strong>
          </p>
          <p><strong>Result:</strong>
  ${isCorrect ? "Correct" : "Incorrect"}
</p>
        `;

        results.appendChild(resultDiv);
      });

      document.getElementById("score").textContent =
        `Your score: ${score} / ${quizQuestions.length}`;

      document.getElementById("quizSection").classList.add("hidden");
      document.getElementById("resultSection").classList.remove("hidden");
      window.scrollTo(0, 0);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
const quizSection = document.getElementById("quizSection");

["copy", "cut", "paste", "contextmenu", "dragstart"].forEach(eventName => {
  quizSection.addEventListener(eventName, event => {
    event.preventDefault();
  });
});

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  // Disable Ctrl+C, Ctrl+V, Ctrl+X, Ctrl+U, Ctrl+S
  if (
    event.ctrlKey &&
    ["c", "v", "x", "u", "s"].includes(key)
  ) {
    event.preventDefault();
  }

  // Disable F12 and developer-tool shortcuts
  if (
    event.key === "F12" ||
    (event.ctrlKey && event.shiftKey &&
      ["i", "j", "c"].includes(key))
  ) {
    event.preventDefault();
  }
});  
function startQuiz() {
  const name = document.getElementById("studentName").value.trim();
  const registerNumber =
    document.getElementById("registerNumber").value.trim();
  const message = document.getElementById("studentMessage");

  if (!name || !registerNumber) {
    message.textContent = "Please enter name and register number.";
    return;
  }

  if (!quizQuestions.length) {
    message.textContent = "Please load the Excel questions first.";
    return;
  }

  localStorage.setItem("studentName", name);
  localStorage.setItem("registerNumber", registerNumber);

  displayQuiz();
}
</script>
</body>
</html>
